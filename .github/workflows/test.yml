# 코드를 올릴 때마다 검사를 돌린다: 계산 로직 → 화면 여정·휴대폰 모양 → 서버 API → 공격 검사.
# 서버 검사는 GitHub 쪽 임시 컴퓨터에 서버를 띄워서 한다 (배포된 사이트는 건드리지 않는다).
name: test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 계산 로직과 서버 공통 코드
        run: node --test tests/logic.test.js tests/server.test.js tests/push.test.js

      # 화면 여정(컴퓨터 너비)과 휴대폰 모양(360·375·412px)을 목업판에서 브라우저로 돌린다
      - name: 화면 여정과 휴대폰 모양
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/browser.js

      - name: 서버 띄우기
        run: |
          printf 'ADMIN_PASSWORD=%s\nSESSION_SECRET=%s\nRATE_WINDOW_SEC=6\nALLOW_RESET=1\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 32)" > .dev.vars
          node scripts/vapid.js
          npx --yes wrangler@4 d1 execute nuhunie --local --file db/schema.sql
          npx wrangler@4 pages dev site --port 8788 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8788/api/public > /dev/null && exit 0; sleep 2; done
          cat server.log; exit 1

      - name: 서버 API
        run: node --test tests/api.test.js

      - name: 공격 검사
        run: node --test tests/abuse.test.js

      - name: 실패하면 서버 기록 보기
        if: failure()
        run: cat server.log || true

  # 검사가 통과한 main 브랜치만 자동으로 배포한다.
  # GitHub 저장소 Settings → Secrets and variables → Actions 에
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 등록되어 있어야 하고, 없으면 건너뛴다.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "배포용 토큰이 등록되지 않아 건너뜁니다."
            exit 0
          fi
          echo "$GITHUB_SHA" > site/version.txt      # 지금 올라가 있는 것이 어느 커밋인지 (/version.txt)
          npx --yes wrangler@4 d1 execute nuhunie --remote --file db/schema.sql
          npx wrangler@4 pages deploy site --project-name nuhunie --branch main
